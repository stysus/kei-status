name: status

# Checks every extension in keiyoushi/extensions-source against its live site and publishes the
# result to GitHub Pages.
#
# The sweep is split into shards that run in parallel. Each shard compiles only its own modules and
# keeps its own Gradle build cache, so a run after a quiet night restores compiled extensions from
# cache instead of rebuilding them and spends its time checking sites. The split is by cost, not by
# module count: a module that declares a hundred sources is one module but many minutes, so shards
# are balanced on the scenarios each module ran last time. Gradle's build cache is content-addressed,
# so a module moving between shards still restores from the cache it was compiled into.
#
# The extension sources are third-party code and are never modified: only their compiled classes
# are read, which is what the harness does locally too.
#
# This workflow does not run on push. A sweep hits every live site, takes hours of runner time and
# writes the state it found back to `data/`, so it is not something a commit should set off; it runs
# on the nightly schedule and when someone asks for it by hand. Changes to the harness are still
# guarded on every push, by `ci.yml`.

on:
  schedule:
    # Daily, off the hour so it does not compete with other scheduled work.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "Parallel shards to split the sweep into"
        required: false
        default: "20"
        type: string
      modules:
        description: "Optional space separated modules, instead of the full sweep"
        required: false
        type: string

permissions:
  # Write, because the run commits the state it recorded back to `data/`.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  # Everything that is the same for every shard happens here, once: reading the tree, and building
  # the harness. The harness is a plain JVM build that does not depend on any extension, so building
  # it per shard was the same eighty seconds of compilation paid twenty times over. It is built here
  # and handed to the shards as an artifact.
  prepare:
    name: Prepare the harness and the shard list
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      total: ${{ steps.discover.outputs.total }}
      shards: ${{ steps.discover.outputs.shards }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out the harness
        uses: actions/checkout@v7

      - name: Check out extensions-source
        uses: actions/checkout@v7
        with:
          repository: keiyoushi/extensions-source
          path: extensions-source
          fetch-depth: 1

      # Every shard pins its checkout to this commit. Twenty independent checkouts of a moving
      # branch can land on different commits, and then a module the shard list names may not exist
      # in the tree a shard actually compiled - which reads on the page as a failed load.
      - name: Identify the upstream revision
        id: source
        run: echo "sha=$(git -C extensions-source rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # This job owns the dependency cache: it restores it, and its post-job save runs before the
      # shards start, so a cold run downloads Maven once rather than once per shard.
      - name: Cache Gradle dependencies
        uses: ./.github/actions/gradle-deps-cache

      - name: Build the harness
        run: ./gradlew :cli:installDist --stacktrace

      # Discovery is the checker's job, not the shell's: `ci/discover.sh` calls it, so the rule for
      # "what is a module" and the split into shards have exactly one implementation, the one the
      # tests cover. That is why the harness is built first.
      - name: Split the tree into shards
        id: discover
        env:
          SHARDS: ${{ inputs.shards }}
          MODULES: ${{ inputs.modules }}
        run: |
          shards="${SHARDS:-20}"
          if [ -n "${MODULES:-}" ]; then
            printf '%s\n' "$MODULES" | tr ' ' '\n' | sed '/^$/d' > manual.txt
            ./ci/discover.sh extensions-source shards "$shards" manual.txt
          else
            ./ci/discover.sh extensions-source shards "$shards"
          fi

      - name: Upload the shard lists
        uses: actions/upload-artifact@v7
        with:
          name: shards
          path: shards/
          retention-days: 1

      - name: Upload the harness
        uses: actions/upload-artifact@v7
        with:
          name: harness
          path: cli/build/install/cli/
          retention-days: 1
          if-no-files-found: error

  sweep:
    name: Shard ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out the harness
        uses: actions/checkout@v7

      - name: Check out extensions-source
        uses: actions/checkout@v7
        with:
          repository: keiyoushi/extensions-source
          path: extensions-source
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Two caches, on purpose. Dependencies are identical in every shard, so one shared key keeps
      # twenty copies out of the cache budget; that key and its paths live in one place, the
      # `gradle-deps-cache` action, so `prepare` and the shards cannot disagree about them. The
      # Gradle build cache is per shard: each shard compiles the same modules every run, so its
      # entries are only useful to itself, and twenty jobs saving to one key would leave nineteen
      # of them discarded.
      #
      # `prepare` runs first and saves the dependency entry, so a cold run downloads Maven once
      # instead of twenty times. A shard restoring that entry is a hit, and a hit means its own
      # save is skipped rather than the same bytes uploaded again.
      #
      # The build-cache key carries the upstream revision, so there is exactly one entry per shard
      # per upstream change: a second run on the same revision restores the same entry for free,
      # and a moved revision restores the previous one through `restore-keys` and saves a new one.
      # The revision is the one `prepare` pinned, not a fresh read, so the key cannot disagree with
      # the tree this shard compiled.
      - name: Restore the Gradle dependency cache
        uses: ./.github/actions/gradle-deps-cache

      - name: Restore this shard's build cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ runner.os }}-shard-${{ matrix.shard }}-${{ needs.prepare.outputs.source_sha }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-shard-${{ matrix.shard }}-

      - name: Check the toolchain
        run: ./ci/environment.sh extensions-source

      - name: Download the harness
        uses: actions/download-artifact@v8
        with:
          name: harness
          path: cli/build/install/cli

      # An artifact does not carry the executable bit, so the launcher has to be made runnable
      # again before `ci/run-shard.sh` calls it.
      - name: Make the harness runnable
        run: chmod +x cli/build/install/cli/bin/cli

      - name: Download the shard list
        uses: actions/download-artifact@v8
        with:
          name: shards
          path: shards

      - name: Build and check the shard
        run: ./ci/run-shard.sh "${{ matrix.file }}" data

      - name: Collect the changed state
        run: ./ci/collect.sh "${{ matrix.shard }}" data "$RUNNER_TEMP/out"

      - name: Upload the changed state
        uses: actions/upload-artifact@v7
        with:
          name: data-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish
    needs: [prepare, sweep]
    # A single failing shard must not stop the shards that succeeded from being recorded; the
    # verify step below is what refuses to publish a partial sweep.
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the harness
        uses: actions/checkout@v7
        with:
          # Full history: the state commit retries its push by rebasing, which a shallow clone
          # cannot do.
          fetch-depth: 0

      # Only a JRE is needed: the harness is downloaded, not built, so this job runs no Gradle.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Download the harness
        uses: actions/download-artifact@v8
        with:
          name: harness
          path: cli/build/install/cli

      - name: Make the harness runnable
        run: chmod +x cli/build/install/cli/bin/cli

      - name: Download the shard lists
        uses: actions/download-artifact@v8
        with:
          name: shards
          path: shards

      - name: Download the changed state
        uses: actions/download-artifact@v8
        with:
          pattern: data-*
          path: incoming
          merge-multiple: true

      - name: Apply the changed state
        run: ./ci/apply.sh incoming data

      - name: Verify the sweep
        run: ./ci/verify.sh data incoming shards/matrix.json

      - name: Render the page
        run: ./ci/publish.sh shards/all.txt site

      - name: Commit the state
        run: ./ci/commit.sh data

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the page
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
