name: ci

# Guards the harness itself. Nothing here touches the network, so it stays fast and runs on every
# change; the live sweep lives in `status.yml`.

on:
  pull_request:
  # `main` only: the recorded state lives on the `data` branch, and that branch is committed to by a
  # bot, so it must not start a harness build.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the harness
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --stacktrace

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the harness
        uses: actions/checkout@v7

      - name: Lint the workflow files
        uses: raven-actions/actionlint@v2

      - name: Lint the CI scripts
        run: shellcheck --severity=warning ci/*.sh
