[versions]
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.4.0"
jsoup = "1.22.2"
injekt = "4135455a2a"
quickjs = "547f5b1597"
zstdKmpOkio = "0.4.0"
webpImageIo = "0.11.0"
bouncycastle = "1.86"
junit = "4.13.2"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
serialization-json-okio = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio", version.ref = "serialization" }
serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "serialization" }
org-json = { module = "org.json:json", version = "20250517" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-brotli = { module = "com.squareup.okhttp3:okhttp-brotli", version.ref = "okhttp" }
okhttp-zstd = { module = "com.squareup.okhttp3:okhttp-zstd", version.ref = "okhttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
injekt-core = { module = "com.github.null2264.injekt:injekt-core", version.ref = "injekt" }
zstd-kmp-okio = { module = "com.squareup.zstd:zstd-kmp-okio", version.ref = "zstdKmpOkio" }
webp-imageio = { module = "com.github.usefulness:webp-imageio", version.ref = "webpImageIo" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
